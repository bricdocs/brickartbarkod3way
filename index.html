<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jannersten Yatay Sistem v7.7</title>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: #fff; text-align: center; padding: 10px; }
        .container { position: relative; width: 100%; max-width: 440px; aspect-ratio: 4 / 3; margin: 0 auto; border: 2px solid #333; }
        video { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(5) brightness(0.9); }
        /* TARAMA ÇIZGISINI TEKRAR YATAY YAPIYORUZ */
        .guide-line { position: absolute; top: 50%; left: 0; width: 100%; height: 3px; background: #ff3b30; transform: translateY(-50%); z-index: 10; }
        .result-box { margin: 10px auto; padding: 12px; background: #2a2a2a; border-radius: 8px; font-size: 22px; font-weight: bold; width: 280px; }
        .debug-info { margin: 10px auto; font-family: monospace; font-size: 13px; color: #00ffcc; background: #000; padding: 10px; border-radius: 6px; width: 280px; text-align: left; line-height: 1.6; }
    </style>
</head>
<body>

    <h2>Jannersten v7.7 (Yatay Sistem)</h2>
    <p>Kartı YATAY çevirip barkodu KIRMIZI çizgiye ortalayın.</p>

    <div class="container">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="guide-line"></div>
    </div>

    <div class="result-box" id="result">Kart Bekleniyor...</div>
    
    <div class="debug-info" id="debug">
        Motor Durumu: Zamanlayıcı Bekleniyor...<br>
        Algılanan Geçiş Sayısı: 0<br>
        Okunan Ham Kod: -
    </div>

    <canvas id="analyzerCanvas" style="display:none;"></canvas>

<script>
// Haritamıza düz kodu ("0101001") ana hedef olarak ekledik
const JANNERSTEN_MAP = {
    "0101001": "Maça 4 (4 of Spades)",
    "1001010": "Maça 4 (4 of Spades) [Ters]"
};

const video = document.getElementById('webcam');
const canvas = document.getElementById('analyzerCanvas');
const ctx = canvas.getContext('2d');
const resultDiv = document.getElementById('result');
const debugDiv = document.getElementById('debug');

canvas.width = 640;
canvas.height = 480;

async function initCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { width: 640, height: 480 }
        });
        video.srcObject = stream;
        
        // Garanti Force-Start tetikleyicimiz aynen korunuyor
        setTimeout(() => {
            setInterval(tick, 1000 / 30);
        }, 1000);

    } catch (err) {
        resultDiv.innerText = "Kamera İzni Yok!";
        console.error(err);
    }
}

function tick() {
    if (video.readyState >= 2) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // YATAY TARAMA DEĞİŞİKLİĞİ: Resmin tam dikey ortasını (Y: 240) satır olarak seçiyoruz
        const midY = 240;
        const fullFrame = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = fullFrame.data;

        const binaryRow = [];
        // Soldan sağa 640 pikseli tarıyoruz
        for (let x = 0; x < canvas.width; x++) {
            const pixelIndex = (midY * canvas.width + x) * 4;
            const r = data[pixelIndex];
            const g = data[pixelIndex + 1];
            const b = data[pixelIndex + 2];
            
            const gray = 0.299 * r + 0.587 * g + 0.114 * b;
            binaryRow.push(gray < 125 ? 0 : 1);
        }

        // Yatay geçişleri say (Kenar gürültüleri için sağdan soldan %15 kırpma)
        const trans = [];
        const startX = Math.floor(canvas.width * 0.15);
        const endX = Math.floor(canvas.width * 0.85);
        
        for (let i = startX; i < endX; i++) {
            if (binaryRow[i] !== binaryRow[i+1]) {
                trans.push(i);
            }
        }

        if (trans.length >= 7) {
            const widths = [];
            for (let i = 0; i < 7; i++) {
                widths.push(trans[i+1] - trans[i]);
            }

            const sum = widths.reduce((a, b) => a + b, 0);
            const avgWidth = sum / widths.length;

            let binaryCode = "";
            for (let i = 0; i < widths.length; i++) {
                binaryCode += (widths[i] > avgWidth) ? "1" : "0";
            }

            let foundCard = JANNERSTEN_MAP[binaryCode];

            if (foundCard) {
                resultDiv.innerText = "🎉 " + foundCard;
                resultDiv.style.color = "#00ffcc";
            } else {
                resultDiv.innerText = "Tanımsız Kart";
                resultDiv.style.color = "#ff9500";
            }
            
            debugDiv.innerHTML = `Motor Durumu: <b>Yatay Tarama Devreye Girdi</b><br>` +
                                 `Algılanan Geçiş Sayısı: <span style="color:#00ffcc; font-weight:bold">${trans.length}</span><br>` +
                                 `Okunan Ham Kod: <span style="color:#fff; font-weight:bold">${binaryCode}</span>`;
        } else {
            resultDiv.innerText = "Kart Bekleniyor...";
            resultDiv.style.color = "#fff";
            
            debugDiv.innerHTML = `Motor Durumu: <b>Yatay Tarama Devreye Girdi</b><br>` +
                                 `Algılanan Geçiş Sayısı: ${trans.length}<br>` +
                                 `Okunan Ham Kod: -`;
        }
    }
}

initCamera();
</script>
</body>
</html>
