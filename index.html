<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jannersten Akıllı Tarayıcı v6.3</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 10px;
        }
        h2 { margin: 5px 0; font-size: 20px; color: #00ffcc; }
        .container {
            position: relative;
            width: 100%;
            max-width: 440px;
            aspect-ratio: 4 / 3;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .guide-line {
            position: absolute;
            top: 50%;
            left: 5%;
            width: 90%;
            height: 3px;
            background-color: #ff3b30;
            transform: translateY(-50%);
            z-index: 10;
        }
        .result-box {
            margin-top: 10px;
            padding: 12px;
            background: #2a2a2a;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            min-width: 280px;
        }
        .debug-info {
            margin-top: 10px;
            font-family: monospace;
            font-size: 12px;
            color: #00ffcc;
            background: #000;
            padding: 10px;
            border-radius: 6px;
            min-width: 280px;
        }
        /* YENİLİK: Canlı Siyah Beyaz Gözetleme Penceresi */
        .preview-box {
            margin-top: 10px;
            text-align: center;
        }
        #analyzerCanvas {
            display: block;
            width: 100%;
            max-width: 200px;
            border: 1px solid #555;
            background: #000;
        }
    </style>
</head>
<body>

    <h2>Jannersten Tarayıcı v6.3</h2>

    <div class="container">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="guide-line" id="guide"></div>
    </div>

    <div class="result-box" id="result">Kart Bekleniyor...</div>
    
    <div class="debug-info" id="debug">
        Tarama Durumu: Başlatılıyor...<br>
        Algılanan Geçiş Sayısı: 0<br>
        Okunan Ham Kod: -
    </div>

    <!-- Hata Ayıklama İçin Canlı Önizleme Alanı -->
    <div class="preview-box">
        <div>Yazılımın Gördüğü Filtre (Debug):</div>
        <canvas id="analyzerCanvas"></canvas>
    </div>

<script>
const JANNERSTEN_MAP = {
    "0101001": "Maça 4 (4 of Spades)",
    "1001010": "Maça 4 (4 of Spades) [Ters]"
};

const video = document.getElementById('webcam');
const canvas = document.getElementById('analyzerCanvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const resultDiv = document.getElementById('result');
const debugDiv = document.getElementById('debug');
const guideLine = document.getElementById('guide');

async function initCamera() {
    try {
        const constraints = {
            video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } }
        };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        video.addEventListener('loadedmetadata', () => {
            // Tuhaflıkları engellemek için canvas boyutunu kameraya eşitliyoruz
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            tick();
        });
    } catch (err) {
        resultDiv.innerText = "Kamera İzni Eksik!";
        console.error(err);
    }
}

function tick() {
    if (video.readyState === video.HAVE_CURRENT_DATA) {
        // Kamerayı canvasa çiz
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // Canvas görüntüsünü manipüle etmek için tamamını alalım (Görsel debug için)
        const fullImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = fullImageData.data;
        
        const midY = Math.floor(canvas.height / 2);
        
        // Hata tespiti için istatistik tutalım
        let maxTransitions = 0;
        let bestY = midY;
        let bestTransitionsArray = [];

        // Önce tüm görseli siyah beyaza çevirip debug ekranına basalım (Kullanıcı görsün diye)
        for (let y = 0; y < canvas.height; y++) {
            const rowStartIndex = y * canvas.width * 4;
            
            // Satır piksellerini topla
            const rowRGBA = [];
            for (let x = 0; x < canvas.width; x++) {
                const idx = rowStartIndex + (x * 4);
                rowRGBA.push(data[idx], data[idx+1], data[idx+2], data[idx+3]);
            }
            
            const binaryRow = applyAdaptiveContrastThreshold(rowRGBA);
            
            // Debug için canvas görüntüsünü siyah-beyaz yapıyoruz
            for (let x = 0; x < canvas.width; x++) {
                const idx = rowStartIndex + (x * 4);
                const color = binaryRow[x] === 1 ? 255 : 0;
                data[idx] = color;     // R
                data[idx+1] = color;   // G
                data[idx+2] = color;   // B
            }

            // Sadece kırmızı çizginin yakınındaki koridorda (Y ekseni) Jannersten çizgisi ara
            if (y > midY - 80 && y < midY + 80) {
                const currentTransitions = getTransitions(binaryRow);
                if (currentTransitions.length >= 6 && currentTransitions.length <= 18) {
                    if (currentTransitions.length > maxTransitions) {
                        maxTransitions = currentTransitions.length;
                        bestY = y;
                        bestTransitionsArray = currentTransitions;
                    }
                }
            }
        }
        
        // Siyah beyaz güncellenmiş görüntüyü debug ekranına bas
        ctx.putImageData(fullImageData, 0, 0);

        // Kod çözme adımı
        if (bestTransitionsArray.length >= 7) {
            const widths = [];
            for (let i = 0; i < 7; i++) {
                widths.push(bestTransitionsArray[i+1] - bestTransitionsArray[i]);
            }

            const sum = widths.reduce((a, b) => a + b, 0);
            const avgWidth = sum / widths.length;

            let binaryCode = "";
            for (let i = 0; i < widths.length; i++) {
                binaryCode += (widths[i] > avgWidth) ? "1" : "0";
            }

            let foundCard = JANNERSTEN_MAP[binaryCode];

            if (foundCard) {
                resultDiv.innerText = foundCard;
                resultDiv.style.color = "#00ffcc";
                guideLine.style.backgroundColor = "#00ffcc";
            } else {
                resultDiv.innerText = "Tanımsız Kart";
                resultDiv.style.color = "#ff9500";
                guideLine.style.backgroundColor = "#ff9500";
            }
            
            debugDiv.innerHTML = `Tarama Durumu: <b>Çizgi Kilitlendi!</b><br>` +
                                 `Algılanan Geçiş Sayısı: ${bestTransitionsArray.length}<br>` +
                                 `Okunan Ham Kod: <span style='color:#fff'>${binaryCode}</span> (Y:${bestY})`;
        } else {
            resultDiv.innerText = "Kart Bekleniyor...";
            resultDiv.style.color = "#fff";
            guideLine.style.backgroundColor = "#ff3b30";
            
            debugDiv.innerHTML = `Tarama Durumu: Satırlar taranıyor...<br>` +
                                 `Algılanan En İyi Geçiş Sayısı: ${maxTransitions}<br>` +
                                 `Okunan Ham Kod: -`;
        }
    }
    requestAnimationFrame(tick);
}

function applyAdaptiveContrastThreshold(rgbaData) {
    const grayPixels = [];
    let minGray = 255;
    let maxGray = 0;

    for (let i = 0; i < rgbaData.length; i += 4) {
        const gray = 0.299 * rgbaData[i] + 0.587 * rgbaData[i+1] + 0.114 * rgbaData[i+2];
        grayPixels.push(gray);
        if (gray < minGray) minGray = gray;
        if (gray > maxGray) maxGray = gray;
    }

    const dynamicThreshold = (minGray + maxGray) / 2;
    const binaryPixels = [];
    for (let i = 0; i < grayPixels.length; i++) {
        // Beyaz kart zeminini güçlendirmek için gürültü filtresi
        binaryPixels.push(grayPixels[i] < (dynamicThreshold - 10) ? 0 : 1);
    }
    return binaryPixels;
}

function getTransitions(pixels) {
    const trans = [];
    // Kenar gürültülerini (ekranın en sağı ve en solu) eliyoruz, sadece orta bölgeye odaklanıyoruz
    const startX = Math.floor(pixels.length * 0.1);
    const endX = Math.floor(pixels.length * 0.9);
    
    for (let i = startX; i < endX; i++) {
        if (pixels[i] !== pixels[i+1]) {
            trans.push(i);
        }
    }
    return trans;
}

initCamera();
</script>
</body>
</html>
