<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jannersten Dikey Tarayıcı v6.6</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 10px;
        }
        h2 { margin: 5px 0; font-size: 20px; color: #00ffcc; }
        .container {
            position: relative;
            width: 100%;
            max-width: 440px;
            aspect-ratio: 4 / 3;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            filter: grayscale(1) contrast(5) brightness(0.9);
        }
        /* YENİLİK: Çizgiler dik olduğu için kılavuz çizgisini de DİKEY yapıyoruz */
        .guide-line {
            position: absolute;
            top: 5%;
            left: 50%;
            width: 3px;
            height: 90%;
            background-color: #ff3b30;
            transform: translateX(-50%);
            z-index: 10;
            box-shadow: 0 0 8px rgba(255, 59, 48, 0.8);
        }
        .result-box {
            margin-top: 10px;
            padding: 12px;
            background: #2a2a2a;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            min-width: 280px;
        }
        .debug-info {
            margin-top: 10px;
            font-family: monospace;
            font-size: 13px;
            color: #00ffcc;
            background: #000;
            padding: 10px;
            border-radius: 6px;
            min-width: 280px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <h2>Jannersten Dikey Tarayıcı v6.6</h2>
    <p>Barkod çizgilerini KIRMIZI DİKEY çizgiye ortalayın.</p>

    <div class="container">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="guide-line" id="guide"></div>
    </div>

    <div class="result-box" id="result">Kart Bekleniyor...</div>
    
    <div class="debug-info" id="debug">
        Firefox Modu: Aktif<br>
        Algılanan Geçiş Noktası: 0<br>
        Okunan Ham Kod: -
    </div>

    <canvas id="analyzerCanvas"></canvas>

<script>
// Maça 4 Kod Haritası
const JANNERSTEN_MAP = {
    "0101001": "Maça 4 (4 of Spades)",
    "1001010": "Maça 4 (4 of Spades) [Ters]"
};

const video = document.getElementById('webcam');
const canvas = document.getElementById('analyzerCanvas');
const ctx = canvas.getContext('2d'); // Firefox kısıtlamasını aşmak için sadeleştirildi
const resultDiv = document.getElementById('result');
const debugDiv = document.getElementById('debug');
const guideLine = document.getElementById('guide');

async function initCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment", width: 640, height: 480 }
        });
        video.srcObject = stream;
        video.addEventListener('loadedmetadata', () => {
            canvas.width = 640;
            canvas.height = 480;
            tick();
        });
    } catch (err) {
        resultDiv.innerText = "Kamera İzni Alınamadı!";
        console.error(err);
    }
}

function tick() {
    if (video.readyState === video.HAVE_CURRENT_DATA) {
        // FIREFOX ÇÖZÜMÜ: Görüntüyü canvas'a çizerken filtrelenmiş videoyu doğrudan yakala
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const midX = Math.floor(canvas.width / 2);
        
        let bestX = midX;
        let maxTransitions = 0;
        let bestTransitionsArray = [];

        // YENİLİK: DİKEY TARAMA MOTORU
        // Kırmızı dikey çizginin sağındaki ve solundaki 60 piksellik alanda sütun taraması yapar
        for (let x = midX - 30; x < midX + 30; x++) {
            // Firefox piksel korumasını delmek için tek satır yerine 1px genişliğinde dikey şerit okuyoruz
            const imgData = ctx.getImageData(x, 0, 1, canvas.height).data;
            
            const binaryColumn = [];
            for (let i = 0; i < imgData.length; i += 4) {
                const gray = 0.299 * imgData[i] + 0.587 * imgData[i+1] + 0.114 * imgData[i+2];
                // Firefox'ta CSS filtresi canva'a geçtiği için 128 eşiği artık çalışır
                binaryColumn.push(gray < 128 ? 0 : 1); 
            }

            // Dikey geçiş noktalarını bul (Üstten ve alttan %15'lik boşlukları kırp)
            const trans = [];
            const startY = Math.floor(binaryColumn.length * 0.15);
            const endY = Math.floor(binaryColumn.length * 0.85);
            
            for (let i = startY; i < endY; i++) {
                if (binaryColumn[i] !== binaryColumn[i+1]) {
                    trans.push(i);
                }
            }

            if (trans.length >= 6 && trans.length <= 16) {
                if (trans.length > maxTransitions) {
                    maxTransitions = trans.length;
                    bestX = x;
                    bestTransitionsArray = trans;
                }
            }
        }

        // Kod Çözme
        if (bestTransitionsArray.length >= 7) {
            const widths = [];
            for (let i = 0; i < 7; i++) {
                widths.push(bestTransitionsArray[i+1] - bestTransitionsArray[i]);
            }

            const sum = widths.reduce((a, b) => a + b, 0);
            const avgWidth = sum / widths.length;

            let binaryCode = "";
            for (let i = 0; i < widths.length; i++) {
                binaryCode += (widths[i] > avgWidth) ? "1" : "0";
            }

            let foundCard = JANNERSTEN_MAP[binaryCode];

            if (foundCard) {
                resultDiv.innerText = "🎉 " + foundCard;
                resultDiv.style.color = "#00ffcc";
                guideLine.style.backgroundColor = "#00ffcc";
            } else {
                resultDiv.innerText = "Tanımsız Kart";
                resultDiv.style.color = "#ff9500";
                guideLine.style.backgroundColor = "#ff9500";
            }
            
            debugDiv.innerHTML = `Firefox Modu: <b style="color:#00ffcc">Bağlantı Kuruldu!</b><br>` +
                                 `Algılanan Geçiş Noktası: ${bestTransitionsArray.length}<br>` +
                                 `Okunan Ham Kod: <span style="color:#fff; font-weight:bold">${binaryCode}</span>`;
        } else {
            resultDiv.innerText = "Kart Bekleniyor...";
            resultDiv.style.color = "#fff";
            guideLine.style.backgroundColor = "#ff3b30";
            
            debugDiv.innerHTML = `Firefox Modu: Çizgiler dikey taranıyor...<br>` +
                                 `Algılanan En İyi Geçiş Noktası: ${maxTransitions}<br>` +
                                 `Okunan Ham Kod: -`;
        }
    }
    requestAnimationFrame(tick);
}

initCamera();
</script>
</body>
</html>
