<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jannersten Teşhis v7.4</title>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: #fff; text-align: center; padding: 10px; }
        .container { position: relative; width: 100%; max-width: 440px; aspect-ratio: 4 / 3; margin: 0 auto; border: 2px solid #333; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .guide-line { position: absolute; top: 0; left: 50%; width: 2px; height: 100%; background: red; }
        .debug-info { margin-top: 15px; font-family: monospace; font-size: 14px; color: #00ffcc; background: #000; padding: 15px; border-radius: 6px; text-align: left; display: inline-block; min-width: 300px; }
    </style>
</head>
<body>

    <h2>Jannersten Röntgen Sürümü v7.4</h2>
    <div class="container">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="guide-line"></div>
    </div>

    <div class="debug-info" id="debug">
        Kamera Çözünürlüğü: Ölçülüyor...<br>
        Canvas Çözünürlüğü: Ölçülüyor...<br>
        Merkez Piksel Rengi (RGB): Okunuyor...<br>
        Algılanan Geçiş Sayısı: 0
    </div>

    <canvas id="analyzerCanvas" style="display:none;"></canvas>

<script>
const video = document.getElementById('webcam');
const canvas = document.getElementById('analyzerCanvas');
const ctx = canvas.getContext('2d');
const debugDiv = document.getElementById('debug');

async function initCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        video.addEventListener('loadedmetadata', () => {
            // Tarayıcının kamerayı gerçekte kaç piksel açtığını yakalıyoruz
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            tick();
        });
    } catch (err) {
        debugDiv.innerHTML = "Kamera hatası: " + err.message;
    }
}

function tick() {
    if (video.readyState === video.HAVE_CURRENT_DATA) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // Tüm resim hafızasını al
        const fullFrame = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = fullFrame.data;
        
        // Tam merkezdeki pikselin indeksini bul
        const midX = Math.floor(canvas.width / 2);
        const midY = Math.floor(canvas.height / 2);
        const centerIndex = (midY * canvas.width + midX) * 4;
        
        // Merkez pikselin gerçek renklerini oku
        const r = data[centerIndex];
        const g = data[centerIndex + 1];
        const b = data[centerIndex + 2];

        // Ekrana röntgen sonuçlarını bas
        debugDiv.innerHTML = 
            `Kamera Gerçek Çözünürlüğü: <b>${video.videoWidth} x ${video.videoHeight}</b><br>` +
            `Canvas İşleme Çözünürlüğü: <b>${canvas.width} x ${canvas.height}</b><br>` +
            `Merkez Piksel Rengi (RGB): <b style="color:rgb(${r},${g},${b})">R:${r} G:${g} B:${b}</b><br>` +
            `Algılanan Geçiş Sayısı: 0 (Teşhis Modu)`;
    }
    requestAnimationFrame(tick);
}

initCamera();
</script>
</body>
</html>
