<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jannersten Akıllı Tarayıcı v7.3</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 10px;
        }
        h2 { margin: 5px 0; font-size: 20px; color: #00ffcc; }
        .container {
            position: relative;
            width: 100%;
            max-width: 440px;
            aspect-ratio: 4 / 3;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            filter: grayscale(1) contrast(5) brightness(0.9);
        }
        .guide-line {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 3px;
            height: 90%;
            background-color: #ff3b30;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
    </style>
</head>
<body>

    <h2>Jannersten v7.3</h2>
    <p>Kartı dikey kırmızı çizgiye doğru hizalayın.</p>

    <div class="container">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="guide-line" id="guide"></div>
    </div>

    <div id="result" style="margin-top:10px; padding:12px; background:#2a2a2a; border-radius:8px; font-size:22px; font-weight:bold; text-align:center; min-width:280px;">Kart Bekleniyor...</div>
    
    <div id="debug" style="margin-top:10px; font-family:monospace; font-size:13px; color:#00ffcc; background:#000; padding:10px; border-radius:6px; min-width:280px; line-height:1.6;">
        Tarama Motoru: v7.3 Standart<br>
        Algılanan En İyi Geçiş Sayısı: 0<br>
        Okunan Ham Kod: -
    </div>

    <canvas id="analyzerCanvas"></canvas>

<script>
const JANNERSTEN_MAP = {
    "0101001": "Maça 4 (4 of Spades)",
    "1001010": "Maça 4 (4 of Spades) [Ters]"
};

const video = document.getElementById('webcam');
const canvas = document.getElementById('analyzerCanvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const resultDiv = document.getElementById('result');
const debugDiv = document.getElementById('debug');

async function initCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment", width: 640, height: 480 }
        });
        video.srcObject = stream;
        video.addEventListener('loadedmetadata', () => {
            canvas.width = 640;
            canvas.height = 480;
            tick();
        });
    } catch (err) {
        resultDiv.innerText = "Kamera Başlatılamadı!";
        console.error(err);
    }
}

function tick() {
    if (video.readyState === video.HAVE_CURRENT_DATA) {
        // Kameradaki mevcut kareyi arka plan canvasına tam çözünürlükle kopyala
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        let maxTransitions = 0;
        let bestX = 320;
        let bestTransitionsArray = [];

        // HATA DÜZELTMESİ: Tüm resim matrisini tek seferde hafızaya alıyoruz.
        // Bu sayede tarayıcıların dikey piksel parçalama hatasını engelliyoruz.
        const fullFrame = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = fullFrame.data;

        // Ekranın sol %25'i ile sağ %75'i arasındaki tüm dikey sütunları tara
        const startX = Math.floor(canvas.width * 0.25);
        const endX = Math.floor(canvas.width * 0.75);

        for (let x = startX; x < endX; x += 2) {
            const binaryColumn = [];
            
            // Yukarıdan aşağıya tüm Y koordinatlarını tek tek güvenli indeksle tara
            for (let y = 0; y < canvas.height; y++) {
                const pixelIndex = (y * canvas.width + x) * 4;
                
                const r = data[pixelIndex];
                const g = data[pixelIndex + 1];
                const b = data[pixelIndex + 2];
                
                const gray = 0.299 * r + 0.587 * g + 0.114 * b;
                // Işık parlamalarına karşı güvenli siyah-beyaz eşiği
                binaryColumn.push(gray < 120 ? 0 : 1);
            }

            // Renk kırılma (geçiş) noktalarını bul (Üst ve alttaki gürültüler için %15 kırpma)
            const trans = [];
            const startY = Math.floor(binaryColumn.length * 0.15);
            const endY = Math.floor(binaryColumn.length * 0.85);
            
            for (let i = startY; i < endY; i++) {
                if (binaryColumn[i] !== binaryColumn[i+1]) {
                    trans.push(i);
                }
            }

            // Eğer Jannersten barkod çizgi sayısı aralığında bir geçiş yakalandıysa
            if (trans.length >= 6 && trans.length <= 16) {
                if (trans.length > maxTransitions) {
                    maxTransitions = trans.length;
                    bestX = x;
                    bestTransitionsArray = trans;
                }
            }
        }

        // Kod Çözme ve Eşleştirme Bölümü
        if (bestTransitionsArray.length >= 7) {
            const widths = [];
            for (let i = 0; i < 7; i++) {
                widths.push(bestTransitionsArray[i+1] - bestTransitionsArray[i]);
            }

            const sum = widths.reduce((a, b) => a + b, 0);
            const avgWidth = sum / widths.length;

            let binaryCode = "";
            for (let i = 0; i < widths.length; i++) {
                binaryCode += (widths[i] > avgWidth) ? "1" : "0";
            }

            let foundCard = JANNERSTEN_MAP[binaryCode];

            if (foundCard) {
                resultDiv.innerText = "🎉 " + foundCard;
                resultDiv.style.color = "#00ffcc";
            } else {
                resultDiv.innerText = "Tanımsız Kart";
                resultDiv.style.color = "#ff9500";
            }
            
            debugDiv.innerHTML = `Tarama Motoru: v7.3 Kararlı Dikey<br>` +
                                 `Algılanan En İyi Geçiş Sayısı: <span style="color:#00ffcc; font-weight:bold">${bestTransitionsArray.length}</span><br>` +
                                 `Okunan Ham Kod: <span style="color:#fff; font-weight:bold">${binaryCode}</span> (X:${bestX})`;
        } else {
            resultDiv.innerText = "Kart Bekleniyor...";
            resultDiv.style.color = "#fff";
            
            debugDiv.innerHTML = `Tarama Motoru: v7.3 Kararlı Dikey<br>` +
                                 `Algılanan En İyi Geçiş Sayısı: ${maxTransitions}<br>` +
                                 `Okunan Ham Kod: -`;
        }
    }
    requestAnimationFrame(tick);
}

initCamera();
</script>
</body>
</html>
