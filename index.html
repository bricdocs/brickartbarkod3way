<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jannersten Canlı Akıllı Tarayıcı v6.4</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 10px;
        }
        h2 { margin: 5px 0; font-size: 20px; color: #00ffcc; }
        .container {
            position: relative;
            width: 100%;
            max-width: 440px;
            aspect-ratio: 4 / 3;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            /* YENİLİK: Python filtresini donanımsal olarak tarayıcıya uyguluyoruz */
            filter: grayscale(1) contrast(5) brightness(0.9);
        }
        .guide-line {
            position: absolute;
            top: 50%;
            left: 5%;
            width: 90%;
            height: 3px;
            background-color: #ff3b30;
            transform: translateY(-50%);
            z-index: 10;
        }
        .result-box {
            margin-top: 10px;
            padding: 12px;
            background: #2a2a2a;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            min-width: 280px;
        }
        .debug-info {
            margin-top: 10px;
            font-family: monospace;
            font-size: 13px;
            color: #00ffcc;
            background: #000;
            padding: 10px;
            border-radius: 6px;
            min-width: 280px;
            line-height: 1.6;
        }
        canvas { display: none; }
    </style>
</head>
<body>

    <h2>Jannersten Tarayıcı v6.4</h2>

    <div class="container">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="guide-line" id="guide"></div>
    </div>

    <div class="result-box" id="result">Kart Bekleniyor...</div>
    
    <div class="debug-info" id="debug">
        Tarama Durumu: Başlatılıyor...<br>
        Algılanan Geçiş Noktası: -<br>
        Okunan Ham Kod: -
    </div>

    <canvas id="analyzerCanvas"></canvas>

<script>
// --- MAÇA 4 HARİTASI ---
const JANNERSTEN_MAP = {
    "0101001": "Maça 4 (4 of Spades)",
    "1001010": "Maça 4 (4 of Spades) [Ters]"
};

const video = document.getElementById('webcam');
const canvas = document.getElementById('analyzerCanvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const resultDiv = document.getElementById('result');
const debugDiv = document.getElementById('debug');
const guideLine = document.getElementById('guide');

async function initCamera() {
    try {
        const constraints = {
            video: { facingMode: "environment", width: 640, height: 480 }
        };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        video.addEventListener('loadedmetadata', () => {
            canvas.width = 640;
            canvas.height = 480;
            tick();
        });
    } catch (err) {
        resultDiv.innerText = "Kamera İzni Alınamadı!";
        console.error(err);
    }
}

function tick() {
    if (video.readyState === video.HAVE_CURRENT_DATA) {
        // CSS filtresi uygulanmış video görüntüsünü canvas'a basıyoruz
        ctx.filter = "grayscale(1) contrast(5) brightness(0.9)";
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const midY = Math.floor(canvas.height / 2);
        
        let bestY = midY;
        let maxTransitions = 0;
        let bestTransitionsArray = [];

        // Kırmızı çizginin etrafındaki 60 piksellik alanda dikey tarama (Akıllı Kilitlenme)
        for (let y = midY - 30; y < midY + 30; y++) {
            const imgData = ctx.getImageData(0, y, canvas.width, 1).data;
            
            // Hızlı Siyah-Beyaz tespiti
            const binaryRow = [];
            for (let i = 0; i < imgData.length; i += 4) {
                binaryRow.push(imgData[i] < 128 ? 0 : 1); // 0: Siyah, 1: Beyaz
            }

            // Geçiş noktalarını bul
            const trans = [];
            // Sağdan ve soldan %15 kırpıyoruz (Kenar gürültülerini silmek için)
            const startX = Math.floor(binaryRow.length * 0.15);
            const endX = Math.floor(binaryRow.length * 0.85);
            
            for (let i = startX; i < endX; i++) {
                if (binaryRow[i] !== binaryRow[i+1]) {
                    trans.push(i);
                }
            }

            // Jannersten çizgileri için en kararlı geçiş koridoru
            if (trans.length >= 6 && trans.length <= 16) {
                if (trans.length > maxTransitions) {
                    maxTransitions = trans.length;
                    bestY = y;
                    bestTransitionsArray = trans;
                }
            }
        }

        // Kod Çözme İşlemi
        if (bestTransitionsArray.length >= 7) {
            const widths = [];
            for (let i = 0; i < 7; i++) {
                widths.push(bestTransitionsArray[i+1] - bestTransitionsArray[i]);
            }

            const sum = widths.reduce((a, b) => a + b, 0);
            const avgWidth = sum / widths.length;

            let binaryCode = "";
            for (let i = 0; i < widths.length; i++) {
                binaryCode += (widths[i] > avgWidth) ? "1" : "0";
            }

            // Kart Kontrolü
            let foundCard = JANNERSTEN_MAP[binaryCode];

            if (foundCard) {
                resultDiv.innerText = foundCard;
                resultDiv.style.color = "#00ffcc";
                guideLine.style.backgroundColor = "#00ffcc";
            } else {
                resultDiv.innerText = "Tanımsız Kart";
                resultDiv.style.color = "#ff9500";
                guideLine.style.backgroundColor = "#ff9500";
            }
            
            debugDiv.innerHTML = `Tarama Durumu: <b style="color:#00ffcc">Çizgiler Okunuyor</b><br>` +
                                 `Algılanan Geçiş Noktası: ${bestTransitionsArray.length}<br>` +
                                 `Okunan Ham Kod: <span style="color:#fff; font-weight:bold">${binaryCode}</span>`;
        } else {
            resultDiv.innerText = "Kart Bekleniyor...";
            resultDiv.style.color = "#fff";
            guideLine.style.backgroundColor = "#ff3b30";
            
            debugDiv.innerHTML = `Tarama Durumu: Kart aranıyor...<br>` +
                                 `Algılanan En İyi Geçiş Noktası: ${maxTransitions}<br>` +
                                 `Okunan Ham Kod: -`;
        }
    }
    requestAnimationFrame(tick);
}

initCamera();
</script>
</body>
</html>
