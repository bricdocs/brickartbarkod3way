<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jannersten Mobil Sistem v7.9</title>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: #fff; text-align: center; padding: 10px; margin: 0; }
        h2 { margin: 5px 0; font-size: 20px; color: #00ffcc; }
        .container { position: relative; width: 100%; max-width: 440px; aspect-ratio: 4 / 3; margin: 0 auto; border: 2px solid #333; border-radius: 8px; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(5) brightness(0.9); }
        .guide-line { position: absolute; top: 50%; left: 0; width: 100%; height: 3px; background: #ff3b30; transform: translateY(-50%); z-index: 10; }
        
        /* Yenilik: Kamera Seçim Butonu Tasarımı */
        .btn-cam {
            margin: 10px auto;
            padding: 12px 24px;
            background: #00ffcc;
            color: #000;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: block;
        }
        .btn-cam:active { transform: scale(0.98); }

        .result-box { margin: 5px auto; padding: 12px; background: #2a2a2a; border-radius: 8px; font-size: 22px; font-weight: bold; width: 280px; }
        .debug-info { margin: 10px auto; font-family: monospace; font-size: 13px; color: #00ffcc; background: #000; padding: 10px; border-radius: 6px; width: 280px; text-align: left; line-height: 1.6; }
    </style>
</head>
<body>

    <h2>Jannersten v7.9 (Mobil Sürüm)</h2>
    
    <!-- Yenilik: Kamera Değiştirme Butonu -->
    <button class="btn-cam" id="toggleCamBtn">Kamerayı Değiştir (Ön/Arka)</button>

    <div class="container">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="guide-line"></div>
    </div>

    <div class="result-box" id="result">Kart Bekleniyor...</div>
    
    <div class="debug-info" id="debug">
        Motor Durumu: Başlatılıyor...<br>
        Algılanan Geçiş Sayısı: 0<br>
        Okunan Ham Kod: -
    </div>

    <canvas id="analyzerCanvas" style="display:none;"></canvas>

<script>
const JANNERSTEN_MAP = {
    "0101001": "Maça 4 (4 of Spades)",
    "1001010": "Maça 4 (4 of Spades) [Ters]",
    "0101100": "Maça 5 (5 of Spades)",
    "0011010": "Maça 5 (5 of Spades) [Ters]"
};

const video = document.getElementById('webcam');
const canvas = document.getElementById('analyzerCanvas');
const ctx = canvas.getContext('2d');
const resultDiv = document.getElementById('result');
const debugDiv = document.getElementById('debug');
const toggleCamBtn = document.getElementById('toggleCamBtn');

canvas.width = 640;
canvas.height = 480;

let currentStream = null;
let currentFacingMode = "environment"; // Varsayılan: Arka Kamera
let lastPlayedCard = null; // Üst üste sürekli bip sesini engellemek için hafıza kilidi
let tickInterval = null;

// Yenilik: Tarayıcı Bağımsız Dijital Bip (Beep) Sesi Üretici Algoritması
function playBeepSound() {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // 880Hz yüksek perdeden net bir bip sesi
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); // Kulak tırmalamayacak dengeli ses seviyesi
        
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        oscillator.start();
        // Saniyenin onda biri kadar (120ms) çok kısa ve net çal
        oscillator.stop(audioCtx.currentTime + 0.12); 
    } catch (e) {
        console.error("Ses çalma hatası:", e);
    }
}

// Kamerayı Seçilen Moda Göre Güvenli Başlatma Fonksiyonu
async function startCamera(facingMode) {
    if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
    }
    if (tickInterval) {
        clearInterval(tickInterval);
    }

    try {
        const constraints = {
            video: { 
                width: 640, 
                height: 480,
                facingMode: facingMode
            }
        };
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        
        // Eski Firefox ve mobil uyumlu Force-Start zamanlayıcısı
        setTimeout(() => {
            tickInterval = setInterval(tick, 1000 / 30);
        }, 1000);

    } catch (err) {
        resultDiv.innerText = "Kamera İzni Alınamadı!";
        console.error(err);
    }
}

// Yenilik: Butona Basıldığında Kamera Yönünü Değiştirme Mekanizması
toggleCamBtn.addEventListener('click', () => {
    currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
    startCamera(currentFacingMode);
});

function tick() {
    if (video.readyState >= 2) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const midY = 240;
        const fullFrame = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = fullFrame.data;

        const binaryRow = [];
        for (let x = 0; x < canvas.width; x++) {
            const pixelIndex = (midY * canvas.width + x) * 4;
            const r = data[pixelIndex];
            const g = data[pixelIndex + 1];
            const b = data[pixelIndex + 2];
            
            const gray = 0.299 * r + 0.587 * g + 0.114 * b;
            binaryRow.push(gray < 125 ? 0 : 1);
        }

        const trans = [];
        const startX = Math.floor(canvas.width * 0.15);
        const endX = Math.floor(canvas.width * 0.85);
        
        for (let i = startX; i < endX; i++) {
            if (binaryRow[i] !== binaryRow[i+1]) {
                trans.push(i);
            }
        }

        if (trans.length >= 7) {
            const widths = [];
            for (let i = 0; i < 7; i++) {
                widths.push(trans[i+1] - trans[i]);
            }

            const sum = widths.reduce((a, b) => a + b, 0);
            const avgWidth = sum / widths.length;

            let binaryCode = "";
            for (let i = 0; i < widths.length; i++) {
                binaryCode += (widths[i] > avgWidth) ? "1" : "0";
            }

            let foundCard = JANNERSTEN_MAP[binaryCode];

            if (foundCard) {
                resultDiv.innerText = "🎉 " + foundCard;
                resultDiv.style.color = "#00ffcc";
                
                // Yenilik: Kart ilk defa veya yeni okunduğunda tek bir kez BİP sesi çıkartır
                if (lastPlayedCard !== foundCard) {
                    playBeepSound();
                    lastPlayedCard = foundCard;
                }
            } else {
                resultDiv.innerText = "Tanımsız Kart";
                resultDiv.style.color = "#ff9500";
                lastPlayedCard = null; // Kart çekildiğinde kilidi sıfırla
            }
            
            debugDiv.innerHTML = `Motor Durumu: <b>Canlı Mobil Mod</b><br>` +
                                 `Algılanan Geçiş Sayısı: <span style="color:#00ffcc; font-weight:bold">${trans.length}</span><br>` +
                                 `Okunan Ham Kod: <span style="color:#fff; font-weight:bold">${binaryCode}</span>`;
        } else {
            resultDiv.innerText = "Kart Bekleniyor...";
            resultDiv.style.color = "#fff";
            lastPlayedCard = null; // Ortada kart yoksa ses kilidini serbest bırak
            
            debugDiv.innerHTML = `Motor Durumu: <b>Canlı Mobil Mod</b><br>` +
                                 `Algılanan Geçiş Sayısı: ${trans.length}<br>` +
                                 `Okunan Ham Kod: -`;
        }
    }
}

// İlk açılışta varsayılan olarak arka kamerayla başla
startCamera(currentFacingMode);
</script>
</body>
</html>
